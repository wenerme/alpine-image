name: Release Alpine images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Alpine release version; empty uses builds/VERSION
        required: false
        type: string
        default: ''
      dry_run:
        description: Build and list assets without creating or updating a Release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alpine-release-${{ inputs.version || 'builds-version' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Resolve metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          metadata=$(bun scripts/alpine.ts release-info --version "$INPUT_VERSION")
          echo "$metadata" | jq -r '"version=\(.version)"' >> "$GITHUB_OUTPUT"
          echo "$metadata" | jq -r '"tag=\(.tag)"' >> "$GITHUB_OUTPUT"
          echo "$metadata" | jq -r '"title=\(.title)"' >> "$GITHUB_OUTPUT"
          {
            echo '### Release metadata'
            echo
            echo "$metadata" | jq
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-lts
            arch: x86_64
            flavor: lts
          - name: x86_64-virt
            arch: x86_64
            flavor: virt
          - name: aarch64-lts
            arch: aarch64
            flavor: lts
          - name: aarch64-virt
            arch: aarch64
            flavor: virt
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build image
        env:
          ALPINE_RELEASE: ${{ needs.prepare.outputs.version }}
          ALPINE_MIRROR: https://dl-cdn.alpinelinux.org/alpine
          ARCH: ${{ matrix.arch }}
          FLAVOR: ${{ matrix.flavor }}
        run: ./docker-build.sh

      - name: Verify asset
        env:
          ALPINE_RELEASE: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          asset="dist/alpine-${ARCH}-${FLAVOR}-${ALPINE_RELEASE}.img.gz"
          test -s "$asset"
          sha256sum "$asset" | tee "$asset.sha256"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-image-${{ matrix.name }}
          path: |
            dist/alpine-${{ matrix.arch }}-${{ matrix.flavor }}-${{ needs.prepare.outputs.version }}.img.gz
            dist/alpine-${{ matrix.arch }}-${{ matrix.flavor }}-${{ needs.prepare.outputs.version }}.img.gz.sha256
          if-no-files-found: error
          retention-days: 1


  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alpine-image-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: |
          set -euo pipefail
          find dist -type f -maxdepth 1 -print -exec ls -lh {} \;

      - name: Create or update Release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.title }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          AlpineLinux ${RELEASE_VERSION} disk images.

          Generated by GitHub Actions from ${GITHUB_SHA}.
          EOF
          )
          set +e
          release_response=$(gh api --include "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" 2>&1)
          release_status=$?
          set -e
          if printf '%s\n' "$release_response" | grep -Eq '^HTTP/[0-9.]+ 2[0-9][0-9]'; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif printf '%s\n' "$release_response" | grep -Eq '^HTTP/[0-9.]+ 404'; then
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$notes"
          else
            printf '%s\n' "$release_response" >&2
            exit "$release_status"
          fi

      - name: Dry-run summary
        if: inputs.dry_run == true
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.title }}
        run: |
          {
            echo '### Dry-run release'
            echo
            echo "tag: $RELEASE_TAG"
            echo "title: $RELEASE_TITLE"
            echo
            find dist -maxdepth 1 -type f -print | sort
          } >> "$GITHUB_STEP_SUMMARY"
